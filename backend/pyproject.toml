[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zill"
version = "0.1.0"
description = "Zill: the AI agent that routes you through the shade."
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "numpy>=1.26",
  "numba>=0.60",
  "scipy>=1.13",
  "pvlib>=0.11",
  "pandas>=2.2",
  "shapely>=2.0",
  "pyproj>=3.6",
  "trimesh>=4.4",
  "mapbox-earcut>=1.0",
  "pygltflib>=1.16",
  "pillow>=10.3",
  "httpx>=0.27",
  "sse-starlette>=2.1",
  "openai>=1.40",
  "python-dotenv>=1.0",
  "networkx>=3.3",
  "orjson>=3.10",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "httpx>=0.27", "matplotlib>=3.8"]

[tool.hatch.build.targets.wheel]
packages = ["zill"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
